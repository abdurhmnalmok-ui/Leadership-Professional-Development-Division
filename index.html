<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>أكاديمية شرطة لوس سانتوس - LSPD</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <style>body { font-family: 'Cairo', sans-serif; }</style>
</head>
<body class="bg-[#080B12] text-slate-200 font-sans antialiased min-h-screen">

    <!-- Registration Gate -->
    <div id="registrationGate" class="fixed inset-0 z-[999] bg-[#080B12] overflow-y-auto">
        <div class="min-h-screen flex items-center justify-center p-4">
            <div class="bg-[#0c1019] border-2 border-slate-800 rounded-3xl shadow-2xl w-full max-w-2xl p-8 space-y-6 my-8">
                <div class="text-center border-b border-slate-800 pb-4">
                    <div class="inline-block bg-slate-800 text-amber-400 text-xs font-semibold px-4 py-1.5 rounded-full mb-4 border border-slate-700">
                        LSPD Command College
                    </div>
                    <h1 class="text-2xl font-black text-amber-400">تسجيل بيانات الدخول</h1>
                    <p class="text-slate-400 text-xs mt-2">يرجى تعبئة البيانات التالية قبل الدخول للموقع.</p>
                </div>

                <div class="space-y-4">
                    <div>
                        <label class="block text-xs font-bold text-slate-400 mb-1.5">الاسم:</label>
                        <input type="text" id="regFullName" placeholder="اكتب اسمك الكامل..." class="w-full bg-[#141a27] border border-slate-700 rounded-xl px-4 py-3 text-sm text-slate-200 focus:outline-none focus:border-amber-400">
                    </div>

                    <div>
                        <label class="block text-xs font-bold text-slate-400 mb-1.5">اليونت أو الكود العسكري:</label>
                        <input type="text" id="regUnitCode" placeholder="مثال: A-12" class="w-full bg-[#141a27] border border-slate-700 rounded-xl px-4 py-3 text-sm text-slate-200 focus:outline-none focus:border-amber-400">
                    </div>

                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <div>
                            <label class="block text-xs font-bold text-slate-400 mb-1.5">الرتبة الحالية:</label>
                            <select id="regCurrentRank" class="w-full bg-[#141a27] border border-slate-700 rounded-xl px-4 py-3 text-sm text-slate-200 focus:outline-none focus:border-amber-400">
                                <option value="" disabled selected>اختر الرتبة...</option>
                                <option value="Sergeant">Sergeant</option>
                                <option value="First Sergeant">First Sergeant</option>
                                <option value="Staff Sergeant">Staff Sergeant</option>
                                <option value="Lieutenant">Lieutenant</option>
                                <option value="First Lieutenant">First Lieutenant</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-xs font-bold text-slate-400 mb-1.5">الرتبة القادمة:</label>
                            <select id="regNextRank" class="w-full bg-[#141a27] border border-slate-700 rounded-xl px-4 py-3 text-sm text-slate-200 focus:outline-none focus:border-amber-400">
                                <option value="" disabled selected>اختر الرتبة...</option>
                                <option value="Sergeant">Sergeant</option>
                                <option value="First Sergeant">First Sergeant</option>
                                <option value="Staff Sergeant">Staff Sergeant</option>
                                <option value="Lieutenant">Lieutenant</option>
                                <option value="First Lieutenant">First Lieutenant</option>
                            </select>
                        </div>
                    </div>

                    <div>
                        <label class="block text-xs font-bold text-slate-400 mb-1.5">يوزر حساب الديسكورد:</label>
                        <input type="text" id="regDiscordUser" placeholder="مثال: username" class="w-full bg-[#141a27] border border-slate-700 rounded-xl px-4 py-3 text-sm text-slate-200 focus:outline-none focus:border-amber-400">
                    </div>
                </div>

                <button onclick="submitRegistration()" class="w-full bg-amber-400 hover:bg-amber-500 text-slate-950 font-black py-3.5 rounded-xl transition text-sm shadow-lg">
                    حفظ البيانات 💾
                </button>
            </div>
        </div>
    </div>

    <div id="siteWrapper" class="hidden min-h-screen flex flex-col justify-between w-full">

    <header class="border-b border-slate-800/50 bg-[#0a0e16] sticky top-0 z-50">
        <div class="max-w-[96rem] mx-auto px-6 py-2.5 flex items-center justify-between">
            <div class="flex items-center space-x-4 space-x-reverse">
                <a href="index.html" class="text-amber-400 text-sm font-bold bg-[#0c1019] px-3.5 py-2 rounded-lg border border-slate-700 flex items-center gap-1.5">
                    <span>🏠</span> الصفحة الرئيسية
                </a>
                <button onclick="handleStartTest()" class="text-slate-400 hover:text-white text-sm font-bold bg-[#0c1019] px-3.5 py-2 rounded-lg border border-slate-700 flex items-center gap-1.5 transition">
                    <span>📝</span> بدء الاختبار
                </button>
                <button id="resultNavLink" onclick="handleShowResult()" class="text-slate-400 hover:text-white text-sm font-bold bg-[#0c1019] px-3.5 py-2 rounded-lg border border-slate-700 flex items-center gap-1.5 transition">
                    <span>📊</span> نتيجة الاختبار
                </button>
                <a id="adminNavLink" href="admin.html" class="hidden text-amber-400 hover:text-amber-300 text-sm font-bold bg-[#0c1019] px-3.5 py-2 rounded-lg border border-amber-500/40 flex items-center gap-1.5">
                    <span>⚙️</span> لوحة التحكم
                </a>
            </div>
            
            <div class="flex items-center gap-4">
                <button id="loginBtn" onclick="openDiscordModal()" class="bg-[#5865F2] hover:bg-[#4752C4] text-white text-xs font-bold px-4 py-2 rounded-xl transition flex items-center gap-2 shadow-lg">
                    <span>🎮</span> تسجيل الدخول (المشرفين / المختبرين)
                </button>
                <button id="logoutBtn" onclick="logoutUser()" class="hidden bg-red-600/20 hover:bg-red-600 text-red-400 hover:text-white border border-red-500/30 text-xs font-bold px-4 py-2 rounded-xl transition">
                    تسجيل الخروج
                </button>
            </div>
        </div>
    </header>

    <main class="max-w-7xl mx-auto px-6 py-12 flex-grow flex flex-col items-center justify-center w-full">
        <div class="bg-[#0c1019] border-2 border-slate-800/80 p-10 rounded-3xl shadow-2xl text-center max-w-2xl w-full">
            <h1 class="text-4xl font-black text-amber-400 mb-4">LEADERSHIP COURSE</h1>
            <p class="text-slate-400 text-sm leading-relaxed mb-6">مرحباً بك في أكاديمية شرطة لوس سانتوس. يرجى تسجيل الدخول للبدء بالخضوع للاختبار القيادي.</p>
            
            <div class="flex justify-center gap-4 mb-6">
                <button onclick="handleStartTest()" class="bg-amber-400 hover:bg-amber-500 text-slate-950 px-8 py-3 rounded-xl font-black text-sm transition">بدء الاختبار الآن ←</button>
                <button onclick="handleShowResult()" class="bg-slate-800 hover:bg-slate-700 text-white px-6 py-3 rounded-xl font-bold text-sm transition">عرض نتيجتي 📊</button>
            </div>

            <!-- حاوية عرض النتيجة -->
            <div id="resultStatusContainer" class="mt-4 hidden"></div>
        </div>
    </main>

    <!-- Modal: تسجيل الدخول -->
    <div id="discordModal" class="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
        <div class="bg-[#0c1019] border-2 border-slate-800 p-8 rounded-3xl w-full max-w-md shadow-2xl relative">
            <button onclick="closeDiscordModal()" class="absolute top-4 left-4 text-slate-400 hover:text-white text-lg">✕</button>
            <div class="text-center mb-6">
                <h3 class="text-xl font-black text-white">تسجيل دخول البوابة</h3>
            </div>
            <div class="space-y-4">
                <div>
                    <label class="block text-xs font-bold text-slate-400 mb-2">اسم المستخدم:</label>
                    <input type="text" id="adminUserInput" class="w-full bg-[#141a27] border border-slate-700 rounded-xl px-4 py-3 text-sm text-slate-200">
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-400 mb-2">كلمة المرور:</label>
                    <input type="password" id="adminPassInput" class="w-full bg-[#141a27] border border-slate-700 rounded-xl px-4 py-3 text-sm text-slate-200">
                </div>
                <button onclick="submitAdminLogin()" class="w-full bg-amber-400 hover:bg-amber-500 text-slate-950 font-black py-3 rounded-xl text-sm transition">دخول البوابة 🚀</button>
            </div>
        </div>
    </div>

    </div>

    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyBaoWelTtGQjUBTSDjOIc35DrYap-lyH6c",
            authDomain: "leadership-professional.firebaseapp.com",
            databaseURL: "https://leadership-professional-default-rtdb.firebaseio.com",
            projectId: "leadership-professional",
            storageBucket: "leadership-professional.firebasestorage.app",
            messagingSenderId: "620428076068",
            appId: "1:620428076068:web:f4f0aa97b7282830d1a4b1"
        };
        if (!firebase.apps.length) { firebase.initializeApp(firebaseConfig); }
        const db = firebase.database();

        function checkRegistrationGate() {
            let reg = localStorage.getItem('registeredDiscordUser');
            if (reg) {
                document.getElementById('registrationGate').classList.add('hidden');
                document.getElementById('siteWrapper').classList.remove('hidden');
            }
        }

        function submitRegistration() {
            let fullName = document.getElementById('regFullName').value.trim();
            let unitCode = document.getElementById('regUnitCode').value.trim();
            let currentRank = document.getElementById('regCurrentRank').value;
            let nextRank = document.getElementById('regNextRank').value;
            let discordUser = document.getElementById('regDiscordUser').value.trim().toLowerCase();

            if (!fullName || !unitCode || !discordUser) return alert("الرجاء تعبئة البيانات!");

            db.ref('lspd_registrations/' + discordUser).set({ fullName, unitCode, currentRank, nextRank, discordUser }).then(() => {
                localStorage.setItem('registeredDiscordUser', discordUser);
                checkRegistrationGate();
            });
        }

        function handleStartTest() {
            let student = localStorage.getItem('studentUser');
            let isAdmin = localStorage.getItem('isAdminLoggedIn');
            if (student || isAdmin === 'true') window.location.href = "tests.html";
            else openDiscordModal();
        }

        function handleShowResult() {
            let discordUser = localStorage.getItem('registeredDiscordUser');
            let resultContainer = document.getElementById('resultStatusContainer');
            if (!discordUser) return alert("الرجاء تسجيل البيانات أولاً!");

            resultContainer.classList.remove('hidden');
            resultContainer.innerHTML = `<div class="text-slate-400 text-sm">جاري جلب النتيجة...</div>`;

            db.ref('lspd_submissions').once('value').then(snapshot => {
                let data = snapshot.val() || {};
                let userSubmission = null;

                Object.keys(data).forEach(key => {
                    if (data[key].discordUser === discordUser) {
                        userSubmission = data[key];
                    }
                });

                if (!userSubmission) {
                    resultContainer.innerHTML = `<div class="bg-slate-800/80 border border-slate-700 p-4 rounded-xl text-slate-300 text-sm">لم يتم العثور على أي نتائج مسجلة لهذا الحساب.</div>`;
                    return;
                }

                if (userSubmission.status === 'فرصة ثانية') {
                    resultContainer.innerHTML = `
                        <div class="bg-amber-500/10 border border-amber-500/30 p-6 rounded-2xl text-center space-y-4">
                            <div class="text-3xl">🔄</div>
                            <h3 class="text-amber-400 font-black text-lg">تقرر إعطاؤك فرصة ثانية!</h3>
                            <p class="text-slate-300 text-sm">تم تقييم اختبارك السابق وتقرر منحك فرصة جديدة لإعادة الاختبار. يمكنك البدء الآن.</p>
                            <a href="tests.html" class="inline-block bg-amber-400 hover:bg-amber-500 text-slate-950 font-black px-6 py-2.5 rounded-xl text-sm transition shadow-lg">
                                الانتقال للاختبار الآن 📝
                            </a>
                        </div>
                    `;
                } else if (userSubmission.status === 'مقبول') {
                    resultContainer.innerHTML = `
                        <div class="bg-emerald-500/10 border border-emerald-500/30 p-6 rounded-2xl text-center space-y-3">
                            <div class="text-3xl">🎉</div>
                            <h3 class="text-emerald-400 font-black text-lg">مبروك! تم قبولك (النسبة: ${userSubmission.score || 0}%)</h3>
                            <p class="text-slate-300 text-sm">تهانينا، لقد تجاوزت الاختبار بنجاح.</p>
                        </div>
                    `;
                } else if (userSubmission.status === 'مرفوض') {
                    resultContainer.innerHTML = `
                        <div class="bg-red-500/10 border border-red-500/30 p-6 rounded-2xl text-center space-y-3">
                            <div class="text-3xl">❌</div>
                            <h3 class="text-red-400 font-black text-lg">نعتذر منك، تم رفض الطلب (النسبة: ${userSubmission.score || 0}%)</h3>
                            <p class="text-slate-300 text-sm">للأسف لم تتجاوز المعايير المطلوبة في الاختبار الحالي.</p>
                        </div>
                    `;
                } else {
                    resultContainer.innerHTML = `
                        <div class="bg-blue-500/10 border border-blue-500/30 p-6 rounded-2xl text-center space-y-3">
                            <div class="text-3xl">⏳</div>
                            <h3 class="text-blue-400 font-black text-lg">اختبارك قيد المراجعة</h3>
                            <p class="text-slate-300 text-sm">طلبك حالياً تحت تصحيح وتقييم لجنة الاختبارات.</p>
                        </div>
                    `;
                }
            });
        }

        function openDiscordModal() { document.getElementById('discordModal').classList.remove('hidden'); }
        function closeDiscordModal() { document.getElementById('discordModal').classList.add('hidden'); }

        function submitAdminLogin() {
            let user = document.getElementById('adminUserInput').value.trim().toLowerCase();
            let pass = document.getElementById('adminPassInput').value.trim();

            if ((user === "m5" && pass === "M113355m") || (user === "admin" && pass === "F!GtqAX!GZ8VU/M")) {
                localStorage.setItem('isAdminLoggedIn', 'true');
                localStorage.setItem('adminName', user);
                window.location.href = "admin.html";
                return;
            }

            db.ref('lspd_users/' + user).once('value').then(snapshot => {
                let data = snapshot.val();
                if (data && data.password === pass) {
                    if (data.role === 'admin') {
                        localStorage.setItem('isAdminLoggedIn', 'true');
                        localStorage.setItem('adminName', data.name);
                        window.location.href = "admin.html";
                    } else {
                        localStorage.setItem('studentUser', user);
                        localStorage.setItem('studentName', data.name);
                        alert("تم تسجيل الدخول بنجاح.");
                        closeDiscordModal();
                        updateUI();
                    }
                } else alert("بيانات الدخول خاطئة!");
            });
        }

        function logoutUser() {
            localStorage.clear();
            updateUI();
        }

        function updateUI() {
            if (localStorage.getItem('isAdminLoggedIn') === 'true' || localStorage.getItem('studentUser')) {
                document.getElementById('logoutBtn').classList.remove('hidden');
                document.getElementById('loginBtn').classList.add('hidden');
            } else {
                document.getElementById('logoutBtn').classList.add('hidden');
                document.getElementById('loginBtn').classList.remove('hidden');
            }

            if (localStorage.getItem('isAdminLoggedIn') === 'true') {
                document.getElementById('adminNavLink').classList.remove('hidden');
            }
        }

        window.onload = function() {
            checkRegistrationGate();
            updateUI();
        };
    </script>
</body>
</html>
