<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نتيجة الاختبار - أكاديمية شرطة لوس سانتوس</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <style>body { font-family: 'Cairo', sans-serif; }</style>
</head>
<body class="bg-[#080B12] text-slate-200 font-sans antialiased min-h-screen flex flex-col justify-between">

    <header class="border-b border-slate-800/50 bg-[#0a0e16] sticky top-0 z-50">
        <div class="max-w-[96rem] mx-auto px-6 py-2.5 flex items-center justify-between">
            <a href="index.html" class="text-slate-400 hover:text-white text-sm font-bold bg-[#0c1019] px-3.5 py-2 rounded-lg border border-slate-700">🏠 الرئيسية</a>
            <div class="text-white font-black text-sm">أكاديمية شرطة لوس سانتوس</div>
        </div>
    </header>

    <main class="flex-grow flex flex-col items-center justify-center p-6 w-full max-w-2xl mx-auto">
        <div id="notLoggedInView" class="hidden bg-[#0c1019] border-2 border-red-500/30 p-8 rounded-3xl text-center space-y-4">
            <h1 class="text-xl font-black text-white">تسجيل الدخول مطلوب</h1>
            <a href="index.html" class="inline-block bg-amber-400 text-slate-950 font-black px-6 py-2.5 rounded-xl text-sm">الذهاب لتسجيل الدخول 🔑</a>
        </div>

        <div id="pendingView" class="hidden bg-[#0c1019] border-2 border-amber-500/30 p-8 rounded-3xl text-center space-y-4">
            <h1 class="text-xl font-black text-white">النتيجة قيد التصحيح والتقييم</h1>
            <p class="text-slate-400 text-sm">تم إرسال إجاباتك بنجاح، وهي الآن قيد المراجعة.</p>
        </div>

        <div id="resultView" class="hidden bg-[#0c1019] border-2 border-slate-800 p-8 rounded-3xl text-center space-y-6 w-full">
            <div id="statusBadge" class="inline-block px-4 py-1.5 rounded-full text-xs font-bold border"></div>
            <h1 class="text-2xl font-black text-white" id="studentName">--</h1>
            <p class="text-slate-400 text-xs" id="examDetails">--</p>
            <div class="bg-[#141a27] border border-slate-800 p-6 rounded-2xl space-y-2">
                <span class="text-xs text-slate-400 font-bold block">النسبة المئوية المحرزة:</span>
                <div class="text-5xl font-black" id="scoreDisplay">0%</div>
            </div>
            <div class="bg-[#141a27] border border-slate-800 p-4 rounded-xl text-right text-xs space-y-2">
                <p class="text-slate-400"><strong>القرار النهائي:</strong> <span id="finalDecisionText" class="text-white">--</span></p>
                <p class="text-slate-400"><strong>ملاحظات المشرف:</strong> <span id="adminNotes" class="text-slate-300">--</span></p>
            </div>
        </div>
    </main>

    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyBaoWelTtGQjUBTSDjOIc35DrYap-lyH6c",
            authDomain: "leadership-professional.firebaseapp.com",
            databaseURL: "https://leadership-professional-default-rtdb.firebaseio.com",
            projectId: "leadership-professional",
            storageBucket: "leadership-professional.firebasestorage.app",
            messagingSenderId: "620428076068",
            appId: "1:620428076068:web:f4f0aa97b7282830d1a4b1"
        };
        if (!firebase.apps.length) { firebase.initializeApp(firebaseConfig); }
        const db = firebase.database();

        document.addEventListener('DOMContentLoaded', () => {
            const studentUser = localStorage.getItem('studentUser');
            if (!studentUser) {
                document.getElementById('notLoggedInView').classList.remove('hidden');
                return;
            }

            db.ref('lspd_submissions').once('value').then(snapshot => {
                const submissions = snapshot.val() || {};
                const userSubKey = Object.keys(submissions).reverse().find(key => 
                    submissions[key] && submissions[key].accountUsername === studentUser
                );

                if (!userSubKey) {
                    document.getElementById('pendingView').classList.remove('hidden');
                    return;
                }

                const subData = submissions[userSubKey];
                if (subData.score === undefined && (!subData.status || subData.status === 'قيد المراجعة')) {
                    document.getElementById('pendingView').classList.remove('hidden');
                    return;
                }

                document.getElementById('resultView').classList.remove('hidden');
                document.getElementById('studentName').innerText = subData.fullName || 'المختبر';
                document.getElementById('examDetails').innerText = `الرتبة: ${subData.targetRank} | الشهادة: ${subData.certificateType}`;
                document.getElementById('scoreDisplay').innerText = (subData.score || 0) + '%';
                document.getElementById('finalDecisionText').innerText = subData.status || 'تم التقييم';
                document.getElementById('adminNotes').innerText = subData.notes || 'لا يوجد ملاحظات.';

                const badge = document.getElementById('statusBadge');
                if (subData.status === 'مقبول' || subData.score >= 70) {
                    badge.innerText = 'PASSED - ناجح';
                    badge.className = 'inline-block px-4 py-1.5 rounded-full text-xs font-bold border border-emerald-500/40 bg-emerald-500/10 text-emerald-400';
                } else if (subData.status === 'فرصة ثانية') {
                    badge.innerText = 'SECOND CHANCE - فرصة ثانية';
                    badge.className = 'inline-block px-4 py-1.5 rounded-full text-xs font-bold border border-amber-500/40 bg-amber-500/10 text-amber-400';
                } else {
                    badge.innerText = 'FAILED - لم يتجاوز الاختبار';
                    badge.className = 'inline-block px-4 py-1.5 rounded-full text-xs font-bold border border-red-500/40 bg-red-500/10 text-red-400';
                }
            });
        });
    </script>
</body>
</html>
